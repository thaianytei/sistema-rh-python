<!DOCTYPE html>
<html>
<head>
    <title>Editar Funcionário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card p-4 shadow">
        <h3>Editar Funcionário</h3>

        <form method="POST">
            <input type="text" name="nome" value="{{ funcionario[1] }}" class="form-control mb-2">
            <input type="text" name="cpf" value="{{ funcionario[2] }}" class="form-control mb-2">
            <input type="date" name="data_nascimento" value="{{ funcionario[3] }}" class="form-control mb-2">
            <input type="text" name="cargo" value="{{ funcionario[4] }}" class="form-control mb-2">
            <input type="number" step="0.01" name="salario" value="{{ funcionario[5] }}" class="form-control mb-2">

            <select name="status" class="form-control mb-3">
                <option value="Ativo" {% if funcionario[6]=="Ativo" %}selected{% endif %}>Ativo</option>
                <option value="Inativo" {% if funcionario[6]=="Inativo" %}selected{% endif %}>Inativo</option>
            </select>

            <button type="submit" class="btn btn-primary">Salvar</button>
            <a href="/" class="btn btn-secondary">Voltar</a>
        </form>
    </div>
</div>

</body>
</html>
